# Host nginx site for tempore.tech. Install with:
#   sudo cp deploy/nginx/tempore.tech.conf /etc/nginx/sites-available/tempore.tech
#   sudo nginx -t && sudo systemctl reload nginx
# Certbot-managed lines are kept as they were.

# Per-IP rate limits. Zone names are prefixed so they don't clash with other
# sites on this host (this file is included in the http {} block).
limit_req_zone $binary_remote_addr zone=tempore_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tempore_api:10m rate=20r/s;

server {
    server_name tempore.tech www.tempore.tech;
    server_tokens off;

    # CORS and the session cookie only accept the apex domain.
    if ($host = www.tempore.tech) {
        return 301 https://tempore.tech$request_uri;
    }

    # Defined here only: any add_header inside a location would drop these.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    limit_req_status 429;
    client_max_body_size 1M;

    # Frontend: static build served by the frontend container.
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The bot talks to the backend over the Docker network; never expose it.
    location ^~ /api/bot/ {
        return 404;
    }

    # OAuth entry points get a much stricter limit than the rest of the API.
    location ~ ^/api/auth/(discord|callback)$ {
        limit_req zone=tempore_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:7000/auth/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=tempore_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:7000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tempore.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tempore.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.tempore.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = tempore.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name tempore.tech www.tempore.tech;
    return 404; # managed by Certbot
}
